version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: opt_postgres
    environment:
      POSTGRES_USER: opt_user
      POSTGRES_PASSWORD: opt_password
      POSTGRES_DB: opt_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
